name: ci
on:
  push:
    branches: [main]
  pull_request:
env:
  PYTHONPATH: src
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m skills_engine.evals.cli --min-f1 0.8 --min-accuracy 0.9



