<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowSky" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0284c7"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <text x="24" y="34" font-size="19" font-weight="700" fill="#0f172a">Skills Intelligence Engine — three-tier taxonomy with self-governance</text>

  <rect x="24" y="58" width="180" height="150" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="114" y="78" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">CONTEXT TYPES</text>
  <text x="40" y="100" font-size="11" fill="#334155">• job_description</text>
  <text x="40" y="118" font-size="11" fill="#334155">• job_definition</text>
  <text x="40" y="136" font-size="11" fill="#334155">• resume / task</text>
  <text x="40" y="154" font-size="11" fill="#334155">• reflection</text>
  <text x="40" y="172" font-size="11" fill="#334155">• user_signal</text>
  <text x="40" y="190" font-size="11" fill="#334155">• content</text>

  <line x1="204" y1="133" x2="252" y2="133" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowSky)"/>

  <rect x="256" y="88" width="150" height="92" rx="8" fill="#eff6ff" stroke="#0284c7"/>
  <text x="331" y="112" font-size="12" font-weight="700" fill="#075985" text-anchor="middle">EXTRACTOR</text>
  <text x="331" y="132" font-size="11" fill="#334155" text-anchor="middle">LLM (OpenAI-compat)</text>
  <text x="331" y="148" font-size="11" fill="#334155" text-anchor="middle">or rule gazetteer</text>
  <text x="331" y="166" font-size="10" fill="#64748b" text-anchor="middle">degrades gracefully</text>

  <line x1="406" y1="134" x2="452" y2="134" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowSky)"/>

  <rect x="456" y="98" width="140" height="72" rx="8" fill="#eff6ff" stroke="#0284c7"/>
  <text x="526" y="122" font-size="12" font-weight="700" fill="#075985" text-anchor="middle">NORMALIZER</text>
  <text x="526" y="141" font-size="11" fill="#334155" text-anchor="middle">fold → exact → alias</text>
  <text x="526" y="157" font-size="11" fill="#334155" text-anchor="middle">→ vector similarity</text>

  <line x1="596" y1="134" x2="642" y2="134" stroke="#0284c7" stroke-width="2" marker-end="url(#arrowSky)"/>

  <rect x="646" y="58" width="300" height="160" rx="8" fill="#f0fdf4" stroke="#059669"/>
  <text x="796" y="80" font-size="12" font-weight="700" fill="#065f46" text-anchor="middle">THREE-TIER RESOLVER (custom first)</text>
  <rect x="664" y="92" width="264" height="30" rx="5" fill="#dcfce7" stroke="#16a34a"/>
  <text x="674" y="111" font-size="11" fill="#14532d">L3 custom — tenant-specific skills</text>
  <rect x="664" y="128" width="264" height="30" rx="5" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="674" y="147" font-size="11" fill="#422006">L2 external — Lightcast / BGT-style vendor tier</text>
  <rect x="664" y="164" width="264" height="30" rx="5" fill="#e2e8f0" stroke="#64748b"/>
  <text x="674" y="183" font-size="11" fill="#1e293b">L1 master — ESCO-style open taxonomy</text>

  <text x="500" y="250" font-size="11" fill="#64748b" text-anchor="middle">every response: skill_id · tier · method · confidence · explanation</text>

  <rect x="256" y="272" width="340" height="74" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="426" y="296" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="middle">FEEDBACK BANDIT (self-learning)</text>
  <text x="426" y="315" font-size="11" fill="#334155" text-anchor="middle">accept/reject → online logistic update w += lr·(y−p)·x</text>
  <text x="426" y="331" font-size="11" fill="#334155" text-anchor="middle">adjusts resolution confidence · weights versioned</text>

  <path d="M 620 218 C 560 260 520 262 430 270" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <path d="M 380 270 C 330 240 310 210 320 184" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowGreen)"/>

  <rect x="646" y="252" width="310" height="130" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="801" y="274" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">LIFECYCLE GOVERNANCE — half-life 2.5y</text>
  <text x="801" y="294" font-size="11" fill="#334155" text-anchor="middle">health = 0.4·recency + 0.4·demand + 0.2·coverage</text>
  <text x="801" y="312" font-size="11" fill="#334155" text-anchor="middle">provisional → active → declining → deprecated → archived</text>
  <text x="801" y="330" font-size="11" fill="#334155" text-anchor="middle">emerging mentions ≥ 3 → auto-propose new skills</text>
  <text x="801" y="348" font-size="11" fill="#334155" text-anchor="middle">weekly cron → snapshot + audit → PR (humans merge)</text>
  <text x="801" y="368" font-size="10" fill="#b45309" text-anchor="middle">never hard-deleted · full audit trail</text>

  <path d="M 900 138 C 950 170 950 230 906 250" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <rect x="256" y="376" width="340" height="86" rx="8" fill="#fffbeb" stroke="#d97706"/>
  <text x="426" y="398" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">MARKET SIGNALS (public APIs)</text>
  <text x="426" y="417" font-size="11" fill="#334155" text-anchor="middle">Arbeitnow job board · USAJOBS-ready · ESCO for master data</text>
  <text x="426" y="435" font-size="11" fill="#334155" text-anchor="middle">postings → infer → resolved demand + unresolved candidates</text>
  <text x="426" y="451" font-size="11" fill="#334155" text-anchor="middle">$0 — no keys required for the default provider</text>

  <path d="M 426 462 L 700 462 C 800 462 860 420 852 386" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <rect x="24" y="496" width="932" height="100" rx="8" fill="#faf5ff" stroke="#7c3aed"/>
  <text x="490" y="520" font-size="12" font-weight="700" fill="#5b21b6" text-anchor="middle">AGENTIC SURFACE</text>
  <rect x="44" y="532" width="220" height="50" rx="6" fill="#ffffff" stroke="#7c3aed"/>
  <text x="154" y="552" font-size="11" font-weight="600" fill="#4c1d95" text-anchor="middle">skills-supervisor</text>
  <text x="154" y="569" font-size="10" fill="#334155" text-anchor="middle">chat agent · tool-calling · workflows</text>
  <rect x="300" y="532" width="220" height="50" rx="6" fill="#ffffff" stroke="#7c3aed"/>
  <text x="410" y="552" font-size="11" font-weight="600" fill="#4c1d95" text-anchor="middle">skills-agent (A2A subagent)</text>
  <text x="410" y="569" font-size="10" fill="#334155" text-anchor="middle">agent card · /tasks · artifacts</text>
  <rect x="556" y="532" width="220" height="50" rx="6" fill="#ffffff" stroke="#7c3aed"/>
  <text x="666" y="552" font-size="11" font-weight="600" fill="#4c1d95" text-anchor="middle">skills-mcp (FastMCP)</text>
  <text x="666" y="569" font-size="10" fill="#334155" text-anchor="middle">infer · normalize · search · lifecycle tools</text>
  <rect x="792" y="532" width="144" height="50" rx="6" fill="#ffffff" stroke="#7c3aed"/>
  <text x="864" y="552" font-size="11" font-weight="600" fill="#4c1d95" text-anchor="middle">agent-registry</text>
  <text x="864" y="569" font-size="10" fill="#334155" text-anchor="middle">cards · heartbeat · briefs</text>

  <line x1="264" y1="557" x2="298" y2="557" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowViolet)"/>
  <line x1="520" y1="557" x2="554" y2="557" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowViolet)"/>
  <line x1="776" y1="557" x2="790" y2="557" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrowViolet)"/>
  <line x1="154" y1="530" x2="154" y2="470" stroke="#7c3aed" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowViolet)"/>

  <text x="490" y="612" font-size="10" fill="#94a3b8" text-anchor="middle">solid = primary flow · dashed = delegation/feedback · every repo runs offline on CPU at $0 infra cost</text>
</svg>
